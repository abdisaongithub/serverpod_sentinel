# This is the configuration file for your production environment.
# Sentinel Production Configuration - Phase 2 Hardened

apiServer:
  port: 8080
  publicHost: api.sentinel.engineering
  publicPort: 443
  publicScheme: https

insightsServer:
  port: 8081
  publicHost: insights.sentinel.engineering
  publicPort: 443
  publicScheme: https

webServer:
  port: 8082
  publicHost: app.sentinel.engineering
  publicPort: 443
  publicScheme: https

database:
  host: database.sentinel.internal
  port: 5432
  name: serverpod_sentinel
  user: sentinel_prod
  requireSsl: true
  maxConnectionCount: 50 # Increased for higher throughput

redis:
  enabled: true # Crucial for Horizontal Scaling & Distributed Caching
  host: redis.sentinel.internal
  port: 6379
  requireSsl: true

maxRequestSize: 1048576 # 1MB - Increased for larger telemetry batches

sessionLogs:
  consoleEnabled: false
  persistentEnabled: true # Enable for auditing

futureCall:
  concurrencyLimit: 5 # Multiple background jobs can run in parallel
  scanInterval: 2000 # Faster response to scheduled tasks
