name: serverpod_sentinel_flutter
description: "Serverpod Sentinel - AI-powered incident management platform."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Existing UI dependencies
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  lucide_icons: ^0.257.0
  flutter_svg: ^2.2.3
  flutter_animate: ^4.5.2
  go_router: ^17.0.1

  # Serverpod Client
  serverpod_sentinel_client:
    path: ../serverpod_sentinel_client
  serverpod_auth_idp_client: ^3.2.2
  serverpod_auth_shared_flutter: ^3.2.2
  serverpod_flutter: ^3.2.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Utilities
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.1.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  shimmer: ^3.0.0
  fl_chart: ^1.1.1
  animations: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  mockito: ^5.4.4

flutter:
  generate: true
  uses-material-design: true
