name: Serverpod Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
        working-directory: serverpod_sentinel_server
      - name: Verify analysis
        run: dart analyze
        working-directory: serverpod_sentinel_server
      - name: Run tests
        run: dart test
        working-directory: serverpod_sentinel_server
        continue-on-error: true # Migrations and DB connection might fail in CI without setup

  flutter-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
      - name: Install client dependencies
        run: flutter pub get
        working-directory: serverpod_sentinel_client
      - name: Install flutter dependencies
        run: flutter pub get
        working-directory: serverpod_sentinel_flutter
      - name: Verify analysis
        run: flutter analyze
        working-directory: serverpod_sentinel_flutter
      - name: Run tests
        run: flutter test
        working-directory: serverpod_sentinel_flutter
